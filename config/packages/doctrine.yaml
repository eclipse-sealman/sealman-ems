doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        # server_version: '13'

        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci
        types:
            datetime: Carve\ApiBundle\DBAL\Types\UTCDateTimeType
            bigint: App\DBAL\Types\BigIntType

        profiling_collect_backtrace: "%kernel.debug%"
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        class_metadata_factory_name: App\ORM\Mapping\ClassMetadataFactory
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: "%kernel.project_dir%/src/Entity"
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            enabled: false
        dql:
            string_functions:
                binary: DoctrineExtensions\Query\Mysql\Binary
            datetime_functions:
                dateAdd: DoctrineExtensions\Query\Mysql\DateAdd
                dateSub: DoctrineExtensions\Query\Mysql\DateSub
                utc_timestamp: DoctrineExtensions\Query\Mysql\UtcTimestamp

when@prod:
    doctrine:
        orm:
            # There was a bit of deprecation and un-deprecation with this metadata_cache_driver configuration
            # Metadata cache seems to be required to clear cache on production environment
            # Otherwise we get following error:
            # In DoctrineMetadataCacheWarmer.php line 38: DoctrineMetadataCacheWarmer must load metadata first, check priority of your warmers.
            metadata_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool
