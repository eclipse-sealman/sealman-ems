# This is used by actions using dorny/paths-filter@v3 (https://github.com/dorny/paths-filter)
# Defines path filters for detecting changes in specific docker images (including dependency in images)
# ALWAYS keep in sync with *.Dockerfile.dockerignore files

# docker/images/core/core.Dockerfile.dockerignore
core: &core
    - 'docker/images/core/core.Dockerfile'
    - 'docker/images/core/core.Dockerfile.dockerignore'
    - 'docker/images/core/assets/**'

# docker/images/composer/composer.Dockerfile.dockerignore
composer: &composer
    - 'docker/images/composer/composer.Dockerfile'
    - 'docker/images/composer/composer.Dockerfile.dockerignore'

# docker/images/composer/scep.Dockerfile.dockerignore
scep: &scep
    - 'docker/images/scep/scep.Dockerfile'
    - 'docker/images/scep/scep.Dockerfile.dockerignore'
    - 'docker/images/scep/assets/**'

# docker/images/composer/backend.Dockerfile.dockerignore
# Depends on core and composer
backend: &backend
    - *core
    - *composer
    - 'docker/images/backend/backend.Dockerfile'
    - 'docker/images/backend/backend.Dockerfile.dockerignore'
    - 'docker_parameters.yml'
    - 'composer.json'
    - 'composer.lock'
    - 'symfony.lock'
    - 'public/index.php'
    - 'public/favicon.ico'
    - 'public/import_devices_example_file.xlsx'
    - 'public/swagger'
    - 'private'
    - '!(private/**)'
