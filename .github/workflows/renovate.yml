name: Self-Hosted Renovate

on:
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options:
          - debug
          - info
          - warn
          - error
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['log-level'] || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_HOST_RULES:
            '[{"matchHost":"ghcr.io","hostType":"docker","username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}"},
            {"matchHost":"docker.io","hostType":"docker","username":"${{ secrets.DOCKER_HUB_USERNAME }}","password":"${{ secrets.DOCKER_HUB_RENOVATE_TOKEN }}"},
            {"matchHost":"hub.docker.com","hostType":"docker","username":"${{ secrets.DOCKER_HUB_USERNAME }}","password":"${{ secrets.DOCKER_HUB_RENOVATE_TOKEN }}"}]'
          RENOVATE_DOCKER_MAX_PAGES: 10